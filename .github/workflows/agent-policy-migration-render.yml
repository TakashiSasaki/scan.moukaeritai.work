name: Render migrated agent policy

on:
  pull_request:
    branches:
      - scan.moukaeritai.work

permissions:
  contents: write

jobs:
  render:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - name: Check out pull request branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Migrate finalized adoption identity in the worktree
        env:
          TOOLCHAIN_REPOSITORY: TakashiSasaki/templates
          TOOLCHAIN_REVISION: a21a12f1954d32ddb6574aeb86118e833718c0e5
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path('.agent-policy/adoption.json')
          state = json.loads(path.read_text(encoding='utf-8'))
          state['toolchain'] = {
              'repository': os.environ['TOOLCHAIN_REPOSITORY'],
              'revision': os.environ['TOOLCHAIN_REVISION'],
          }
          path.write_text(
              json.dumps(state, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          PY

      - name: Render generated policy artifacts
        uses: TakashiSasaki/templates@a21a12f1954d32ddb6574aeb86118e833718c0e5
        with:
          command: render
          config: .agent-policy.yml

      - name: Validate rendered policy artifacts
        uses: TakashiSasaki/templates@a21a12f1954d32ddb6574aeb86118e833718c0e5
        with:
          command: validate
          config: .agent-policy.yml

      - name: Install permanent consumer check workflow
        run: |
          cat > .github/workflows/check-agent-policy.yml <<'YAML'
          name: Check agent policy

          on:
            pull_request: {}
            workflow_dispatch: {}

          permissions:
            contents: read

          jobs:
            check:
              runs-on: ubuntu-24.04
              steps:
                - name: Check out repository
                  uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
                - name: Check agent policy
                  uses: TakashiSasaki/templates@a21a12f1954d32ddb6574aeb86118e833718c0e5
                  with:
                    command: check
                    config: .agent-policy.yml
          YAML
          rm .github/workflows/agent-policy-migration-render.yml

      - name: Verify migration boundary
        run: |
          test "$(grep -RIl 'TakashiSasaki/agent-policy' \
            .agent-policy.yml \
            .agent-policy.lock \
            .agent-policy/adoption.json \
            AGENTS.md \
            .agents/skills/validate-agent-policy/SKILL.md \
            .github/workflows/check-agent-policy.yml | wc -l)" -eq 0
          grep -Fq 'repository: TakashiSasaki/templates' .agent-policy.yml
          grep -Fq 'revision: a21a12f1954d32ddb6574aeb86118e833718c0e5' .agent-policy.yml
          grep -Fq 'uses: TakashiSasaki/templates@a21a12f1954d32ddb6574aeb86118e833718c0e5' \
            .github/workflows/check-agent-policy.yml

      - name: Commit generated migration result
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            .agent-policy.yml \
            .agent-policy.lock \
            .agent-policy/adoption.json \
            .agents/skills/validate-agent-policy/SKILL.md \
            AGENTS.md \
            .github/workflows/check-agent-policy.yml \
            .github/workflows/agent-policy-migration-render.yml
          git diff --cached --check
          git commit -m 'Regenerate policy artifacts from templates'
          git push origin "HEAD:${HEAD_BRANCH}"
