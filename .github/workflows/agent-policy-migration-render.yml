name: Render migrated agent policy

on:
  pull_request:
    branches:
      - scan.moukaeritai.work

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Migrate finalized adoption identity in the worktree
        env:
          TOOLCHAIN_REPOSITORY: TakashiSasaki/templates
          TOOLCHAIN_REVISION: a21a12f1954d32ddb6574aeb86118e833718c0e5
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path('.agent-policy/adoption.json')
          state = json.loads(path.read_text(encoding='utf-8'))
          state['toolchain'] = {
              'repository': os.environ['TOOLCHAIN_REPOSITORY'],
              'revision': os.environ['TOOLCHAIN_REVISION'],
          }
          path.write_text(
              json.dumps(state, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          PY

      - name: Render generated policy artifacts
        uses: TakashiSasaki/templates@a21a12f1954d32ddb6574aeb86118e833718c0e5
        with:
          command: render
          config: .agent-policy.yml

      - name: Validate rendered policy artifacts
        uses: TakashiSasaki/templates@a21a12f1954d32ddb6574aeb86118e833718c0e5
        with:
          command: validate
          config: .agent-policy.yml

      - name: Upload rendered migration artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: migrated-agent-policy-artifacts
          if-no-files-found: error
          path: |
            .agent-policy.lock
            .agent-policy/adoption.json
            .agents/skills/validate-agent-policy/SKILL.md
            AGENTS.md
