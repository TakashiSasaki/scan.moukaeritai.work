name: Check agent policy

on:
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Check agent policy
        uses: TakashiSasaki/templates@a21a12f1954d32ddb6574aeb86118e833718c0e5
        with:
          command: check
          config: .agent-policy.yml
