name: Check agent policy

on:
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out migration branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: agent/migrate-policy-toolchain

      - name: Render current stable agent policy
        uses: TakashiSasaki/templates@5de32547e68fa15e24ff3b8affadf12e9d730a41
        with:
          command: render
          config: .agent-policy.yml

      - name: Commit exact generated policy artifacts
        shell: bash
        run: |
          git add AGENTS.md .agent-policy.lock .agents/skills/validate-agent-policy/SKILL.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'Regenerate policy artifacts at current stable toolchain'
          git push origin HEAD:agent/migrate-policy-toolchain
