name: PR 35 product verification

on:
  pull_request:
    branches:
      - scan.moukaeritai.work

permissions:
  contents: read

jobs:
  verify:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out pull request head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Build EFP model prerequisite with root toolchain
        run: npm --prefix packages/efp-model run build

      - name: Prepare Functions prerequisite artifact
        run: npm run prepare:functions-artifact

      - name: Install Functions prerequisite dependencies
        run: npm ci --prefix functions

      - name: Run required pull request verification
        run: npm run verify:pr
